# Production stack for one Linux server: Postgres, migrations, the app, Caddy (automatic HTTPS)
# and a cron container (scheduled jobs + nightly database backups).
# First deploy and every update: sh deploy/deploy.sh   (see README, "Deploying to production")
name: dramaflix

x-db-url: &db-url postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-dramaflix}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dramaflix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to 127.0.0.1 only: the image build reaches it from the host; the internet cannot.
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *db-url
      # Also used for `run --rm migrate npx prisma db seed`: production skips the demo titles.
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      # The build prerenders pages from the database, reached through the 127.0.0.1 port above.
      network: host
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5434/${POSTGRES_DB:-dramaflix}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-DramaFlix}
        NEXT_PUBLIC_DAILYMOTION_PLAYER_ID: ${NEXT_PUBLIC_DAILYMOTION_PLAYER_ID:-}
        ALLOWED_SOURCE_HOSTS: ${ALLOWED_SOURCE_HOSTS:-}
        IMAGE_HOSTS: ${IMAGE_HOSTS:-}
        INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    env_file: .env
    environment:
      DATABASE_URL: *db-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. example.com)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  cron:
    # Postgres image: has pg_dump for backups and busybox crond + wget for the scheduled jobs.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-dramaflix}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/crontab:/etc/crontabs/root:ro
      - ./backups:/backups
    # busybox crond starts jobs with an empty environment, so save it for the jobs to load.
    entrypoint: ["sh", "-c", "export -p > /etc/cron.env && exec crond -f -l 8"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
